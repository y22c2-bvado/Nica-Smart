
name: CI/CD Docker -> GHCR -> Render

on:
  push:
    branches:
      - main
      - YaderDX
      - y22c2-bvado

  pull_request:
    branches:
      - main
      - YaderDX
      - y22c2-bvado

  workflow_dispatch:

# ==========================================
# NICA S-MART | VARIABLES GLOBALES
# ==========================================

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

jobs:

  # ========================================
  # CI: CONSTRUIR, PROBAR Y PUBLICAR
  # ========================================

  build-test-push:
    name: Construir y probar Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ====================================
      # 1. DESCARGAR CÓDIGO
      # ====================================

      - name: Descargar código
        uses: actions/checkout@v4

      # ====================================
      # 2. CONFIGURAR DOCKER BUILDX
      # ====================================

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ====================================
      # 3. VALIDAR VARIABLES
      # ====================================

      - name: Validar variables de Vite
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Falta VITE_API_URL en GitHub Actions Variables."
            exit 1
          fi

          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Falta VITE_GOOGLE_CLIENT_ID en GitHub Actions Variables."
            exit 1
          fi

          echo "Variables de Vite configuradas."

      # ====================================
      # 4. CONSTRUIR IMAGEN DOCKER
      # ====================================

      - name: Construir imagen Docker
        run: |
          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t smart-nica-db:test .

      # ====================================
      # 5. PREPARAR RED DE PRUEBAS
      # ====================================

      - name: Preparar red Docker
        run: |
          docker network create nica-ci-network

          # Contenedor auxiliar para resolver el
          # hostname "backend" que utiliza Nginx.
          # No reemplaza una prueba real del API.
          docker run -d \
            --name backend \
            --network nica-ci-network \
            alpine:3.20 \
            sleep 300

          echo "Red de pruebas configurada."

      # ====================================
      # 6. PROBAR FRONTEND
      # ====================================

      - name: Verificar funcionamiento de NICA S-MART
        run: |
          echo "Iniciando NICA S-MART..."

          docker run -d \
            --name app \
            --network nica-ci-network \
            -p 8080:80 \
            smart-nica-db:test

          echo "Esperando respuesta de Nginx..."

          READY=false

          for i in $(seq 1 20); do
            if curl -fsS \
              http://localhost:8080/ \
              -o /tmp/nica-smart.html; then
              READY=true
              break
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Nginx no respondió."
            docker logs app
            exit 1
          fi

          echo "Verificando documento HTML..."

          test -s /tmp/nica-smart.html

          echo "Verificando nombre de la tienda..."

          if ! grep -Eiq 'nica[[:space:]-]*s[[:space:]-]*mart' \
            /tmp/nica-smart.html; then
            echo "::error::El HTML no contiene NICA S-MART."
            exit 1
          fi

          echo "Verificando JavaScript de Vite..."

          JS_FILE=$(grep -oE \
            'src="/assets/[^"]+\.js"' \
            /tmp/nica-smart.html \
            | head -1 \
            | cut -d'"' -f2)

          if [ -z "$JS_FILE" ]; then
            echo "::error::No se encontró JavaScript compilado."
            exit 1
          fi

          echo "Comprobando archivo JavaScript..."

          curl -fsS \
            "http://localhost:8080$JS_FILE" \
            -o /dev/null

          echo "Comprobando tipo de contenido..."

          curl -fsSI \
            "http://localhost:8080$JS_FILE" \
            | grep -Eiq 'content-type:.*(javascript|ecmascript)'

          echo "NICA S-MART pasó las pruebas del frontend."

      # ====================================
      # 7. MOSTRAR LOGS SI FALLA
      # ====================================

      - name: Mostrar logs si falla
        if: failure()
        run: |
          docker ps -a
          docker logs app || true
          docker logs backend || true

      # ====================================
      # 8. LIMPIAR CONTENEDORES DE PRUEBA
      # ====================================

      - name: Limpiar contenedores
        if: always()
        run: |
          docker rm -f app backend || true
          docker network rm nica-ci-network || true

      # ====================================
      # 9. LOGIN EN GHCR
      # ====================================

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ====================================
      # 10. GENERAR ETIQUETAS
      # ====================================

      - name: Generar etiquetas Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha

      # ====================================
      # 11. PUBLICAR EN GHCR
      # ====================================

      - name: Publicar imagen Docker en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ env.VITE_GOOGLE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ========================================
  # CD: DESPLEGAR EN RENDER
  # SOLO DESDE MAIN
  # ========================================

  deploy-render:
    name: Desplegar en Render
    needs: build-test-push

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Solicitar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Solicitud de despliegue enviada a Render."
