name: Docker Build and Push

on:
  push:
    branches:
      - main
      - y22c2-bvado
      - YaderDX

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND ---
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/y22c2-bvado/nica-smart-backend:latest
            ghcr.io/y22c2-bvado/nica-smart-backend:${{ github.ref_name }}

      # --- FRONTEND ---
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:3000
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/y22c2-bvado/nica-smart-frontend:latest
            ghcr.io/y22c2-bvado/nica-smart-frontend:${{ github.ref_name }}
